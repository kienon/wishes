<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What You Mean To Me 🌌</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #000; 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; /* Prevent scroll on drag */
        }
        
        /* NEON INTRO SCREEN */
        .neon-box {
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f, 0 0 30px #ff007f;
            background: rgba(20, 0, 10, 0.6);
            backdrop-filter: blur(8px);
        }
        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        /* 3D GALAXY SCENE */
        #universe {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        
        #camera {
            position: absolute;
            width: 0; height: 0;
            transform-style: preserve-3d;
            transform: rotateX(20deg) rotateY(0deg);
            transition: transform 0.1s ease-out; /* Smooth panning */
        }

        /* BLACK HOLE EFFECTS */
        .black-hole-core {
            position: absolute;
            width: 80px; height: 80px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 40px 15px #9d00ff, 0 0 80px 30px #ff007f;
            z-index: 10;
        }

        .accretion-disk {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 15%, rgba(157, 0, 255, 0.4) 25%, rgba(255, 0, 127, 0.2) 40%, transparent 65%);
            transform: translate(-50%, -50%) rotateX(90deg);
            box-shadow: inset 0 0 50px rgba(157, 0, 255, 0.5);
            animation: spinDisk 20s linear infinite;
        }

        .accretion-disk-2 {
            position: absolute;
            width: 800px; height: 800px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%) rotateX(90deg);
            animation: spinDisk 30s linear infinite reverse;
        }

        /* FLOATING WORDS */
        .galaxy-word {
            position: absolute;
            white-space: nowrap;
            transform-style: preserve-3d;
            will-change: transform;
            font-weight: 600;
            text-shadow: 0 0 8px currentColor;
            pointer-events: none;
        }

        /* BACKGROUND STARS */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            background: radial-gradient(circle at center, #0a0015 0%, #000 100%);
        }

        @keyframes spinDisk {
            from { transform: translate(-50%, -50%) rotateX(90deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(90deg) rotateZ(360deg); }
        }
    </style>
</head>
<body>

    <!-- AUDIO PLAYER -->
    <audio id="bg-music" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- BACKGROUND STARS CANVAS -->
    <canvas id="bg-canvas"></canvas>

    <!-- INTRO NEON SCREEN (Matches Video) -->
    <div id="screen-intro" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black transition-opacity duration-1000">
        <div onclick="startExperience()" class="neon-box px-8 py-12 rounded-3xl cursor-pointer text-center max-w-sm w-full animate-pulse hover:scale-105 transition-transform duration-300">
            <h1 class="neon-text text-2xl md:text-3xl font-bold leading-snug mb-8 uppercase tracking-wide">
                What You Mean<br>To Me, My Love
            </h1>
            <p class="text-pink-300 text-sm font-medium tracking-wider">
                ✨ Tap to discover Princess ✨
            </p>
        </div>
    </div>

    <!-- 3D GALAXY SCENE -->
    <div id="universe" class="opacity-0 pointer-events-none transition-opacity duration-1000">
        <div id="camera">
            
            <!-- Accretion Disk (Flat) -->
            <div class="accretion-disk"></div>
            <div class="accretion-disk-2"></div>
            
            <!-- Black Hole Center -->
            <div class="black-hole-core"></div>

            <!-- Words will be injected here via JS -->
            <div id="words-container" style="transform-style: preserve-3d;"></div>

        </div>
    </div>

    <!-- Interaction Hint -->
    <div id="hint-text" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-40 text-white/50 text-xs tracking-widest uppercase opacity-0 transition-opacity duration-1000 pointer-events-none">
        Swipe to rotate galaxy
    </div>

    <script>
        // --- 1. BACKGROUND STARS CANVAS ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: (Math.random() * 0.02) + 0.005
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed *= -1;
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();


        // --- 2. 3D GALAXY WORD CLOUD LOGIC ---
        const romanticWords = [
            "My Everything", "Sayang", "Cinta", "Beautiful", "Gorgeous", 
            "My Sun", "My Moon", "Bidadari", "Forever", "Eternity", 
            "Manja", "Rindu", "Kesayangan", "Precious", "My Heart", 
            "Soulmate", "Sweetheart", "Kehidupan", "My Universe", "Bintang", 
            "Syurga", "Bahagia", "Senyumanmu", "My Safe Place", "Perfect",
            "Destiny", "Brillas", "Mi Sol", "Amor Eterno", "Dulzura",
            "Passion", "Joy", "Peace", "Comfort", "Home", "Treasure"
        ];
        
        // Colors from the video (Purple, Pink, Blue, White, Gold)
        const colors = ['#e0aaff', '#ff99c8', '#90e0ef', '#ffffff', '#ffd60a'];
        const wordsContainer = document.getElementById('words-container');
        const wordObjects = [];
        const TOTAL_WORDS = 150; // Dense cloud

        // Generate Words
        for (let i = 0; i < TOTAL_WORDS; i++) {
            const wordText = romanticWords[Math.floor(Math.random() * romanticWords.length)];
            const span = document.createElement('span');
            span.className = 'galaxy-word';
            span.innerText = wordText;
            
            // Randomize appearance
            const color = colors[Math.floor(Math.random() * colors.length)];
            const fontSize = Math.floor(Math.random() * 14) + 10; // 10px to 24px
            span.style.color = color;
            span.style.fontSize = `${fontSize}px`;
            
            wordsContainer.appendChild(span);

            // Calculate spherical orbit parameters
            const radius = Math.random() * 400 + 80; // Distance from center (80px to 480px)
            const angle = Math.random() * Math.PI * 2; // Initial position on disk
            const speed = (Math.random() * 0.005 + 0.001) * (Math.random() < 0.5 ? 1 : -1); // Orbit speed & direction
            
            // Y-offset creates a thick disk (not completely flat)
            const yOffset = (Math.random() - 0.5) * 100; // -50 to 50

            wordObjects.push({
                element: span,
                radius: radius,
                angle: angle,
                speed: speed,
                y: yOffset
            });
        }

        // Animation Loop for Orbiting Words
        function animateGalaxy() {
            wordObjects.forEach(obj => {
                obj.angle += obj.speed;
                // Circular orbit math (XZ plane)
                const x = Math.cos(obj.angle) * obj.radius;
                const z = Math.sin(obj.angle) * obj.radius;
                
                // Apply 3D Translation. Note: translate(-50%, -50%) centers the text origin.
                obj.element.style.transform = `translate3d(${x}px, ${obj.y}px, ${z}px) translate(-50%, -50%)`;
            });
            requestAnimationFrame(animateGalaxy);
        }
        animateGalaxy();


        // --- 3. CAMERA PANNING INTERACTION (Mouse & Touch) ---
        const camera = document.getElementById('camera');
        let camRotX = 30; // Initial tilt looking down slightly
        let camRotY = 0;
        let isDragging = false;
        let startX, startY;

        function startDrag(clientX, clientY) {
            isDragging = true;
            startX = clientX;
            startY = clientY;
        }

        function doDrag(clientX, clientY) {
            if (!isDragging) return;
            const deltaX = clientX - startX;
            const deltaY = clientY - startY;
            
            camRotY += deltaX * 0.3; // Pan left/right
            camRotX -= deltaY * 0.3; // Pan up/down
            
            // Clamp X rotation so it doesn't flip completely upside down
            camRotX = Math.max(-20, Math.min(80, camRotX));
            
            camera.style.transform = `rotateX(${camRotX}deg) rotateY(${camRotY}deg)`;
            
            startX = clientX;
            startY = clientY;
        }

        function endDrag() {
            isDragging = false;
        }

        // Mouse Events
        document.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        document.addEventListener('mousemove', (e) => doDrag(e.clientX, e.clientY));
        document.addEventListener('mouseup', endDrag);

        // Touch Events
        document.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY));
        document.addEventListener('touchmove', (e) => doDrag(e.touches[0].clientX, e.touches[0].clientY));
        document.addEventListener('touchend', endDrag);


        // --- 4. START EXPERIENCE (Transitions & Music) ---
        function startExperience() {
            // Play Music
            const music = document.getElementById('bg-music');
            if(music) music.play().catch(e => console.log(e));

            // Hide Intro, Show Galaxy
            document.getElementById('screen-intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('screen-intro').style.display = 'none';
                const universe = document.getElementById('universe');
                universe.classList.remove('pointer-events-none');
                universe.style.opacity = '1';
                document.getElementById('hint-text').style.opacity = '1';
                
                // Hide hint after 4 seconds
                setTimeout(() => {
                    document.getElementById('hint-text').style.opacity = '0';
                }, 4000);
            }, 1000);
        }

        // Handle window resize for canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
