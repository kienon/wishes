<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Galaxy - What You Mean To Me 🌌</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- THREE.JS & ORBIT CONTROLS VIA CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Poppins', sans-serif; }
        #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0; transition: opacity 1.5s ease-in-out; }
        
        /* NEON INTRO SCREEN */
        .neon-box {
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f;
            background: rgba(20, 0, 10, 0.8);
            backdrop-filter: blur(8px);
        }
        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }
    </style>
</head>
<body>

    <!-- AUDIO -->
    <audio id="bg-music" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- INTRO NEON SCREEN -->
    <div id="screen-intro" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black transition-opacity duration-1000">
        <div onclick="startExperience()" class="neon-box px-8 py-12 rounded-3xl cursor-pointer text-center max-w-sm w-full animate-pulse hover:scale-105 transition-transform duration-300">
            <h1 class="neon-text text-2xl md:text-3xl font-bold leading-snug mb-8 uppercase tracking-wide">
                What You Mean<br>To Me, My Love
            </h1>
            <p class="text-pink-300 text-sm font-medium tracking-wider">
                ✨ Tap to discover Princess ✨
            </p>
        </div>
    </div>

    <!-- HINT TEXT -->
    <div id="hint-text" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-40 text-white/50 text-xs tracking-widest uppercase opacity-0 transition-opacity duration-1000 pointer-events-none">
        Swipe & Pinch to explore 360°
    </div>

    <!-- 3D CANVAS CONTAINER -->
    <div id="webgl-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let planet, wordGroup, stars;

        function init3D() {
            const container = document.getElementById('webgl-container');

            // 1. SCENE SETUP
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            // 2. CAMERA SETUP
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 150, 400);

            // 3. RENDERER SETUP
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 4. ORBIT CONTROLS (Swipe, Pan, Zoom)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true; // Auto spin slowly
            controls.autoRotateSpeed = 1.0;
            controls.maxDistance = 800; // Limit zoom out
            controls.minDistance = 100; // Limit zoom in

            // 5. CREATE 3D PLANET (Core + Wireframe outer)
            const planetGeometry = new THREE.SphereGeometry(40, 32, 32);
            
            // Solid inner glowing core
            const coreMaterial = new THREE.MeshBasicMaterial({ color: 0x220044 });
            const planetCore = new THREE.Mesh(planetGeometry, coreMaterial);
            scene.add(planetCore);

            // Wireframe outer sphere
            const wireGeometry = new THREE.SphereGeometry(45, 16, 16);
            const wireMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff007f, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            planet = new THREE.Mesh(wireGeometry, wireMaterial);
            scene.add(planet);

            // 6. CREATE 3D STARS (Particles)
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8 });
            
            const starsVertices = [];
            for (let i = 0; i < 2000; i++) {
                const x = THREE.MathUtils.randFloatSpread(1500);
                const y = THREE.MathUtils.randFloatSpread(1500);
                const z = THREE.MathUtils.randFloatSpread(1500);
                starsVertices.push(x, y, z);
            }
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);

            // 7. CREATE FLOATING WORDS (SPRITES)
            // Sprites in Three.js ALWAYS face the camera automatically! (Perfect Billboarding)
            wordGroup = new THREE.Group();
            scene.add(wordGroup);

            const romanticWords = [
                "My Everything", "Sayang", "Cinta", "Beautiful", "Gorgeous", 
                "My Sun", "My Moon", "Bidadari", "Forever", "Eternity", 
                "Manja", "Rindu", "Kesayangan", "Precious", "My Heart", 
                "Soulmate", "Sweetheart", "Kehidupan", "Universe", "Bintang", 
                "Syurga", "Bahagia", "Senyumanmu", "Safe Place", "Perfect"
            ];
            const colors = ['#e0aaff', '#ff99c8', '#90e0ef', '#ffffff', '#ffd60a'];

            // Function to generate text as a canvas texture
            function createTextSprite(message, color) {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512; // High res canvas for crisp text
                canvas.height = 128;
                
                context.font = "Bold 40px 'Poppins', Arial";
                context.fillStyle = color;
                context.textAlign = "center";
                context.textBaseline = "middle";
                
                // Add Glow effect to text
                context.shadowColor = color;
                context.shadowBlur = 15;
                
                context.fillText(message, canvas.width / 2, canvas.height / 2);
                
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);
                
                // Scale sprite to look correct in 3D space
                sprite.scale.set(100, 25, 1); 
                return sprite;
            }

            // Scatter words around the planet
            for(let i = 0; i < 150; i++) {
                const word = romanticWords[Math.floor(Math.random() * romanticWords.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const sprite = createTextSprite(word, color);
                
                // Random position in a donut/sphere shape around the planet
                const radius = Math.random() * 300 + 70;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                
                // Flatten the sphere slightly to look like a galaxy disk
                sprite.position.x = radius * Math.sin(phi) * Math.cos(theta);
                sprite.position.y = (radius * Math.sin(phi) * Math.sin(theta)) * 0.3; // flatten Y axis
                sprite.position.z = radius * Math.cos(phi);
                
                wordGroup.add(sprite);
            }

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Slowly rotate the wireframe planet
            if(planet) {
                planet.rotation.y += 0.005;
                planet.rotation.x += 0.002;
            }
            
            // Slowly rotate the entire word group
            if(wordGroup) {
                wordGroup.rotation.y -= 0.001; // Counter rotation to the camera autoRotate
            }

            controls.update(); // Required for damping & autoRotate
            renderer.render(scene, camera);
        }

        // START TRIGGER
        function startExperience() {
            const music = document.getElementById('bg-music');
            if(music) music.play().catch(e => console.log(e));

            document.getElementById('screen-intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('screen-intro').style.display = 'none';
                document.getElementById('webgl-container').style.opacity = '1';
                document.getElementById('hint-text').style.opacity = '1';
                
                // Initialize 3D ONLY when started to save battery/performance before interaction
                init3D();

                setTimeout(() => {
                    document.getElementById('hint-text').style.opacity = '0';
                }, 5000);
            }, 1000);
        }
    </script>
</body>
</html>
