<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Campfire Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050914;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .scene-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #030611 0%, #0a1329 60%, #101b35 100%);
      overflow: hidden;
    }

    /* 100% KOD CSS DARI VIDEO EDITOR */
    .campfire-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 55% 40% at 50% 72%,
        rgba(255, 140, 50, 0.35) 0%,
        rgba(255, 90, 20, 0.12) 35%,
        transparent 70%
      );
      animation: ember-pulse 2.8s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes ember-pulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.04); }
    }

    /* SVG ARTWORK LAYER (POKOK, BATU & SEMAK) */
    .svg-artwork {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* CANVAS UNTUK API & BARA INTERAKTIF */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      cursor: pointer;
    }

    /* TEKS CLICK THE FIRE */
    .click-hint {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 200, 150, 0.5);
      font-size: 0.7rem;
      letter-spacing: 3px;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
      animation: pulseText 2s infinite alternate;
    }

    @keyframes pulseText {
      0% { opacity: 0.2; }
      100% { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    
    <!-- GLOW EFFECT DARI VIDEO -->
    <div class="campfire-glow"></div>

    <!-- SILUET PEMANDANGAN (POKOK, LANDSKAP, BATU, SEMAK) -->
    <svg class="svg-artwork" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
      <!-- Background Trees & Mountains -->
      <path fill="#070e20" opacity="0.7" d="M0 900 L0 500 L80 420 L160 520 L240 380 L350 510 L480 340 L600 490 L720 310 L850 480 L980 330 L1100 490 L1250 360 L1350 470 L1440 400 L1440 900 Z"/>
      <path fill="#040817" d="M0 900 L0 580 L120 480 L220 590 L380 430 L520 600 L680 410 L820 610 L950 450 L1120 620 L1280 460 L1440 580 L1440 900 Z"/>
      
      <!-- Middle Ground Forest Silhouette -->
      <g fill="#02040d">
        <!-- Trees Left -->
        <polygon points="50,900 100,520 150,900"/>
        <polygon points="120,900 180,480 240,900"/>
        <polygon points="200,900 280,550 360,900"/>
        <!-- Trees Right -->
        <polygon points="1080,900 1160,510 1240,900"/>
        <polygon points="1180,900 1260,460 1340,900"/>
        <polygon points="1280,900 1350,530 1420,900"/>
      </g>

      <!-- Campfire Rocks (Batu-batu sekeliling api) -->
      <g fill="#0b1326" stroke="#040711" stroke-width="4">
        <ellipse cx="650" cy="745" rx="22" ry="12" />
        <ellipse cx="685" cy="752" rx="26" ry="14" />
        <ellipse cx="730" cy="755" rx="30" ry="15" />
        <ellipse cx="775" cy="752" rx="25" ry="13" />
        <ellipse cx="810" cy="745" rx="20" ry="11" />
        <ellipse cx="670" cy="762" rx="24" ry="12" />
        <ellipse cx="790" cy="762" rx="22" ry="11" />
        <ellipse cx="730" cy="768" rx="35" ry="14" />
      </g>

      <!-- Campfire Logs (Kayu Api Silang) -->
      <g fill="#1a0f07" stroke="#080402" stroke-width="3">
        <rect x="660" y="725" width="130" height="16" rx="8" transform="rotate(-15 725 733)"/>
        <rect x="660" y="725" width="130" height="16" rx="8" transform="rotate(15 725 733)"/>
        <rect x="670" y="730" width="110" height="14" rx="7" transform="rotate(5 725 733)"/>
      </g>

      <!-- Foreground Bush/Leaves (Semak Samun Depan) -->
      <g fill="#010207">
        <path d="M-20 900 Q 80 800 200 900 Q 300 780 450 900 Z"/>
        <path d="M1000 900 Q 1150 780 1300 900 Q 1380 820 1460 900 Z"/>
      </g>
    </svg>

    <div class="click-hint">CLICK THE FIRE</div>
    
    <!-- CANVAS UNTUK EFEK API & SPARK -->
    <canvas id="fireCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('fireCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Tapak Api Tepat di Atas Kayu SVG (72% Ketinggian Skrin)
    function getFireBase() {
      return {
        x: width * 0.5,
        y: height * 0.725
      };
    }

    const flames = [];
    const sparks = [];

    // Class Api Menggelembung
    class Flame {
      constructor() {
        this.reset();
      }
      reset() {
        const base = getFireBase();
        this.x = base.x + (Math.random() - 0.5) * 35;
        this.y = base.y + (Math.random() - 0.5) * 10;
        this.radius = Math.random() * 22 + 14;
        this.speedY = Math.random() * 2.8 + 1.8;
        this.speedX = (Math.random() - 0.5) * 1.2;
        this.life = 1;
        this.decay = Math.random() * 0.025 + 0.012;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.radius *= 0.96;
        this.life -= this.decay;
        if (this.life <= 0 || this.radius <= 1) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        g.addColorStop(0, `rgba(255, 245, 180, ${this.life})`);
        g.addColorStop(0.35, `rgba(255, 130, 20, ${this.life * 0.85})`);
        g.addColorStop(0.85, `rgba(220, 40, 0, ${this.life * 0.4})`);
        g.addColorStop(1, `rgba(150, 10, 0, 0)`);
        
        ctx.fillStyle = g;
        ctx.fill();
        ctx.restore();
      }
    }

    // Class Percikan Bara (Sparks & Embers)
    class Spark {
      constructor(isBurst = false) {
        const base = getFireBase();
        this.x = base.x + (Math.random() - 0.5) * 45;
        this.y = base.y - 10;
        this.size = Math.random() * 2.2 + 0.8;
        this.speedY = isBurst ? (Math.random() * 5 + 3) : (Math.random() * 2.2 + 0.8);
        this.speedX = isBurst ? (Math.random() - 0.5) * 5 : (Math.random() - 0.5) * 1.8;
        this.opacity = 1;
        this.decay = Math.random() * 0.015 + 0.005;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.04) * 0.6;
        this.opacity -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = '#ffca3a';
        ctx.shadowColor = '#ff924c';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Cipta 65 partikel api
    for (let i = 0; i < 65; i++) {
      flames.push(new Flame());
    }

    // Click Event: Tambah letupan bara api
    window.addEventListener('click', () => {
      for (let i = 0; i < 40; i++) {
        sparks.push(new Spark(true));
      }
    });

    // Render Loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Render Api
      flames.forEach(f => {
        f.update();
        f.draw();
      });

      // Spawning Bara Api Secara Berkala
      if (Math.random() < 0.5) {
        sparks.push(new Spark());
      }

      // Render Bara Api
      sparks.forEach((s, index) => {
        s.update();
        s.draw();
        if (s.opacity <= 0) {
          sparks.splice(index, 1);
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
