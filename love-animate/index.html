<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    svg {
      display: none;
    }
  </style>
  <!-- Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- SVG Path Hati Presisi -->
  <svg viewBox="0 0 600 552">
    <path id="path" d="M300,522 C290,512 40,330 40,180 C40,90 110,30 200,30 C250,30 280,60 300,90 C320,60 350,30 400,30 C490,30 560,90 560,180 C560,330 310,512 300,522 Z"/>
  </svg>

  <script>
    // 1. Setup Three.js Scene, Camera & WebGL Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 600;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Tepat Seperti Kod Dalam Video
    const path = document.querySelector("#path");
    const length = path.getTotalLength();
    const vertices = [];
    const particlesCount = 2000;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particlesCount * 3);
    const colors = new Float32Array(particlesCount * 3);

    // Warna Pink/Magenta Sebiji Macam Video
    const colorPink = new THREE.Color("#ff1493");
    const colorLightPink = new THREE.Color("#ffb6c1");

    const tl = gsap.timeline({ repeat: -1, yoyo: true, repeatDelay: 0.5 });

    let i = 0;
    for (let l = 0; l < length; l += length / particlesCount) {
      const point = path.getPointAtLength(l);
      
      const vector = new THREE.Vector3(point.x, -point.y, 0);
      vector.x += (Math.random() - 0.5) * 30;
      vector.y += (Math.random() - 0.5) * 30;
      vector.z += (Math.random() - 0.5) * 70;
      
      vertices.push(vector);

      // Set Kedudukan Akhir (Target)
      positions[i * 3] = vector.x - 600 / 2;
      positions[i * 3 + 1] = vector.y + 552 / 2;
      positions[i * 3 + 2] = vector.z;

      // Warna Rawak Antara Deep Pink & Light Pink
      const mixedColor = colorPink.clone().lerp(colorLightPink, Math.random());
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;

      // Logic GSAP Animation persis kod video:
      // tl.from(vector, { x: 600 / 2, y: -552 / 2, z: 0, ease: "power2.inOut", duration: "random(2, 5)" }, i * 0.002)
      const currentIdx = i;
      const startX = 0;
      const startY = 0;
      const startZ = 0;
      const targetX = positions[currentIdx * 3];
      const targetY = positions[currentIdx * 3 + 1];
      const targetZ = positions[currentIdx * 3 + 2];

      // Mula dari titik tengah (Center)
      positions[currentIdx * 3] = startX;
      positions[currentIdx * 3 + 1] = startY;
      positions[currentIdx * 3 + 2] = startZ;

      tl.to(positions, {
        [currentIdx * 3]: targetX,
        [currentIdx * 3 + 1]: targetY,
        [currentIdx * 3 + 2]: targetZ,
        duration: gsap.utils.random(2, 4),
        ease: "power2.inOut",
        onUpdate: () => {
          geometry.attributes.position.needsUpdate = true;
        }
      }, i * 0.0015);

      i++;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Material Partikel (Glowing Soft Pink)
    const material = new THREE.PointsMaterial({
      size: 4,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // Dynamic Auto-Fit untuk SEMUA Skrin (Mobile, Tablet, Monitor)
    function adjustScale() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);

      // Auto Adjust Jarak Kamera Mengikut Saiz Skrin
      if (width < 600) {
        camera.position.z = 850; // Skrin Telefon
      } else if (width < 1024) {
        camera.position.z = 700; // Skrin Tablet
      } else {
        camera.position.z = 600; // Skrin Desktop
      }
    }

    window.addEventListener('resize', adjustScale);
    adjustScale();

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
