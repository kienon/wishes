<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Particle Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #021a19;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* SVG Path Tersembunyi (digunakan untuk bentuk hati) */
    svg {
      display: none;
    }
  </style>
  <!-- Library Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Shape Hati SVG -->
  <svg viewBox="0 0 100 100">
    <path id="heart-path" d="M 50,30 A 20,20 0 0,0 10,50 C 10,75 35,85 50,95 C 65,85 90,75 90,50 A 20,20 0 0,0 50,30 Z" />
  </svg>

  <script>
    // 1. Setup Scene, Camera & Renderer Three.js
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 100;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. Ambil SVG Heart Path untuk jana koordinat
    const path = document.querySelector("#heart-path");
    const length = path.getTotalLength();
    const numParticles = 2500;
    
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(numParticles * 3);
    const targetPositions = [];
    const colors = new Float32Array(numParticles * 3);

    // Palet warna Teal, Turquoise & Light Green
    const palette = [
      new THREE.Color('#2dd4bf'),
      new THREE.Color('#14b8a6'),
      new THREE.Color('#a8e6cf'),
      new THREE.Color('#5eead4')
    ];

    let i = 0;
    for (let j = 0; j < numParticles; j++) {
      const point = path.getPointAtLength((j / numParticles) * length);
      
      // Tukar skala & koordinat SVG ke 3D Space
      const x = (point.x - 50) * 1.8 + (Math.random() - 0.5) * 3;
      const y = -(point.y - 55) * 1.8 + (Math.random() - 0.5) * 3;
      const z = (Math.random() - 0.5) * 10;

      targetPositions.push({ x, y, z });

      // Kedudukan asal (di tengah/terkumpul)
      positions[j * 3] = (Math.random() - 0.5) * 5;
      positions[j * 3 + 1] = (Math.random() - 0.5) * 5;
      positions[j * 3 + 2] = (Math.random() - 0.5) * 5;

      // Berikan warna variasi Teal/Green
      const color = palette[Math.floor(Math.random() * palette.length)];
      colors[j * 3] = color.r;
      colors[j * 3 + 1] = color.g;
      colors[j * 3 + 2] = color.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // 3. Material Partikel
    const material = new THREE.PointsMaterial({
      size: 1.2,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // 4. Animasi GSAP (Sama seperti paparan kod dalam video)
    const tl = gsap.timeline({ repeat: -1, yoyo: true, repeatDelay: 1 });

    const posAttr = geometry.attributes.position;

    targetPositions.forEach((target, index) => {
      tl.to(posAttr.array, {
        [index * 3]: target.x,
        [index * 3 + 1]: target.y,
        [index * 3 + 2]: target.z,
        duration: 2.5,
        ease: "power2.inOut",
        onUpdate: () => {
          posAttr.needsUpdate = true;
        }
      }, index * 0.0008); // Delay mengikut urutan pusingan
    });

    // 5. Render Loop
    function animate() {
      requestAnimationFrame(animate);
      particleSystem.rotation.y += 0.002; // Pusingan halus
      renderer.render(scene, camera);
    }
    animate();

    // Responsive Canvas
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
