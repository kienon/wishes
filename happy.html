<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday My Baby Aina ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }

        /* --- MATRIX RAIN LAYER --- */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- TEXT SEQUENCE LAYER --- */
        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .huge-text {
            font-size: 5rem;
            font-weight: 700;
            color: #ff69b4;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            opacity: 0;
            transform: scale(0.5);
        }

        /* --- STARRY BACKGROUND LAYER --- */
        #stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at bottom, #1b2735 0%, #090a0f 100%);
            opacity: 0;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* --- BEAR ANIMATION LAYER --- */
        #bear-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3;
            flex-direction: column;
        }

        .bear-emoji {
            font-size: 8rem;
            animation: bounce 1s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        /* --- ENVELOPE LAYER --- */
        #envelope-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4;
            cursor: pointer;
        }

        .envelope-card {
            background: #fff;
            width: 250px;
            height: 350px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #333;
        }

        .envelope-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .tap-text {
            font-size: 1rem;
            font-weight: 600;
            color: #ff69b4;
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- POLAROID GALLERY LAYER --- */
        #polaroid-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
            cursor: pointer;
            perspective: 1000px;
        }

        .polaroid {
            background: #fff;
            padding: 15px 15px 40px 15px;
            border-radius: 5px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: absolute;
            display: none;
            max-width: 85%;
        }

        .polaroid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 3px;
        }

        .polaroid-caption {
            color: #333;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            text-align: center;
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            font-weight: bold;
        }

        /* --- FINAL HEART FORMATION LAYER --- */
        #heart-formation-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 6;
        }

        .mini-pic {
            position: absolute;
            width: 50px;
            height: 50px;
            background-size: cover;
            background-position: center;
            border: 2px solid #fff;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Lagu Latar (Autoplay dihandle oleh interaksi user nanti) -->
    <audio id="bg-music" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <div id="stars-bg"></div>
    <canvas id="matrix-canvas"></canvas>

    <div id="text-layer">
        <div class="huge-text" id="center-text"></div>
    </div>

    <div id="bear-layer">
        <div class="bear-emoji">🐻🎂</div>
        <h2 style="color: #ff69b4; font-family: 'Dancing Script', cursive; font-size: 3rem; margin-top: 10px;">Happy Birthday!</h2>
    </div>

    <div id="envelope-layer">
        <div class="envelope-card">
            <div class="envelope-icon">🤲❤️</div>
            <div class="tap-text">Tap to Open</div>
        </div>
    </div>

    <div id="polaroid-layer">
        <!-- Tukar gambar1.jpg - gambar4.jpg dengan gambar korang -->
        <div class="polaroid">
            <img src="gambar1.jpg" alt="Photo 1">
            <div class="polaroid-caption">Happy Birthday Sayang 🤍</div>
        </div>
        <div class="polaroid">
            <img src="gambar2.jpg" alt="Photo 2">
            <div class="polaroid-caption">As long as you're smilin...</div>
        </div>
        <div class="polaroid">
            <img src="gambar3.jpg" alt="Photo 3">
            <div class="polaroid-caption">I'm happy. Stay happy my love ✨</div>
        </div>
        <div class="polaroid">
            <img src="gambar4.jpg" alt="Photo 4">
            <div class="polaroid-caption">I love you, My Baby Aina 💖</div>
        </div>
    </div>

    <div id="heart-formation-layer"></div>

    <script>
        // --- 1. MATRIX DIGITAL RAIN EFFECT ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff69b4';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        let matrixInterval = setInterval(drawMatrix, 35);

        // --- 2. GENERATE STARS BACKGROUND ---
        const starsBg = document.getElementById('stars-bg');
        for(let i=0; i<100; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 2 + 1) + 's';
            starsBg.appendChild(star);
        }

        // --- 3. COUNTDOWN & TEXT SEQUENCE TIMELINE ---
        const words = ['3', '2', '1', 'HAPPY', 'BIRTHDAY', 'TO', 'AINA', '❤️'];
        let wordIndex = 0;
        const textElement = document.getElementById('center-text');

        function animateNextWord() {
            if (wordIndex < words.length) {
                textElement.innerText = words[wordIndex];
                gsap.fromTo(textElement, 
                    { scale: 0.2, opacity: 0 }, 
                    { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)",
                      onComplete: () => {
                          gsap.to(textElement, { scale: 1.5, opacity: 0, duration: 0.4, delay: 0.2, onComplete: animateNextWord });
                      }
                    }
                );
                wordIndex++;
            } else {
                transitionToStars();
            }
        }
        
        setTimeout(animateNextWord, 1000); // Start selepas 1 saat

        // --- 4. TRANSITION KE BINTANG & BERUANG ---
        function transitionToStars() {
            clearInterval(matrixInterval);
            gsap.to(canvas, { opacity: 0, duration: 1 });
            gsap.to(starsBg, { opacity: 1, duration: 1 });
            
            const bearLayer = document.getElementById('bear-layer');
            bearLayer.style.display = 'flex';
            gsap.fromTo(bearLayer, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: "elastic.out(1, 0.5)" });

            setTimeout(() => {
                gsap.to(bearLayer, { scale: 0, opacity: 0, duration: 0.8, onComplete: showEnvelope });
            }, 3500);
        }

        // --- 5. ENVELOPE INTERACTION ---
        function showEnvelope() {
            const envLayer = document.getElementById('envelope-layer');
            envLayer.style.display = 'flex';
            gsap.fromTo(envLayer.children[0], { y: 200, opacity: 0, rotation: 10 }, { y: 0, opacity: 1, rotation: 0, duration: 0.8, ease: "back.out(1.2)" });
            
            // Try to play music at this stage
            document.getElementById('bg-music').play().catch(e => console.log("Audio waiting for interaction"));
        }

        document.getElementById('envelope-layer').addEventListener('click', function() {
            document.getElementById('bg-music').play().catch(e => {});
            gsap.to(this.children[0], { scale: 0, opacity: 0, rotation: -20, duration: 0.5, onComplete: startPolaroids });
        });

        // --- 6. POLAROID SLIDESHOW ---
        const polaroids = document.querySelectorAll('.polaroid');
        let currentPol = 0;
        
        function startPolaroids() {
            document.getElementById('envelope-layer').style.display = 'none';
            document.getElementById('polaroid-layer').style.display = 'flex';
            showNextPolaroid();
        }

        function showNextPolaroid() {
            if (currentPol > 0) {
                // Swipe out previous
                gsap.to(polaroids[currentPol - 1], { x: -window.innerWidth, opacity: 0, rotation: -15, duration: 0.6, ease: "power2.in" });
            }
            if (currentPol < polaroids.length) {
                // Pop in next
                polaroids[currentPol].style.display = 'block';
                gsap.fromTo(polaroids[currentPol], 
                    { x: window.innerWidth, opacity: 0, rotation: 15 }, 
                    { x: 0, opacity: 1, rotation: (Math.random() - 0.5) * 8, duration: 0.8, ease: "back.out(1)" }
                );
                currentPol++;
            } else {
                document.getElementById('polaroid-layer').style.display = 'none';
                formHeartGallery();
            }
        }

        document.getElementById('polaroid-layer').addEventListener('click', showNextPolaroid);

        // --- 7. FINAL HEART SHAPE FORMATION ---
        function formHeartGallery() {
            const heartLayer = document.getElementById('heart-formation-layer');
            heartLayer.style.display = 'block';
            
            const totalImages = 45;
            const imagesList = ['gambar1.jpg', 'gambar2.jpg', 'gambar3.jpg', 'gambar4.jpg'];
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2.2;
            const scale = Math.min(window.innerWidth, window.innerHeight) / 35; // Responsive scale

            for (let i = 0; i < totalImages; i++) {
                let imgDiv = document.createElement('div');
                imgDiv.className = 'mini-pic';
                imgDiv.style.backgroundImage = `url(${imagesList[i % imagesList.length]})`;
                heartLayer.appendChild(imgDiv);

                // Heart Math Formula
                let t = (i / totalImages) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3) * scale;
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;

                // Animate flying from center to heart shape
                gsap.fromTo(imgDiv, 
                    { left: centerX - 25 + "px", top: centerY - 25 + "px", scale: 0, opacity: 0, rotation: Math.random() * 360 },
                    { left: (centerX + x - 25) + "px", top: (centerY + y - 25) + "px", scale: 1, opacity: 1, rotation: (Math.random() - 0.5) * 20, duration: 1.5, ease: "power3.out", delay: Math.random() * 1.5 }
                );
            }
        }
    </script>
</body>
</html>
