<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dalia 💖</title>
    <link rel="stylesheet" href="style.css">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- KAD UTAMA PAKEJ ASAS -->
    <div class="card">
        <div class="heart-icon">💖</div>
        <h1>Happy Birthday, Dalia!</h1>
        <p class="subtitle">Semoga panjang umur dan dimurahkan rezeki ✨</p>

        <!-- KOTAK MESEJ / UCAPAN -->
        <div class="message-box">
            <p>
                "Terima kasih kerana menjadi seseorang yang membawa senyuman dalam hidup ini. Semoga hari lahirmu tahun ini dipenuhi dengan kebahagiaan dan kasih sayang."
            </p>
        </div>

        <!-- BUTTON SURPRISE / CELEBRATION -->
        <button class="celebrate-btn" onclick="triggerConfetti()">🎉 Make a Wish!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
